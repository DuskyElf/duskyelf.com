name: Excalidraw Browser Runtime

on:
  push:
    branches:
      - v4
    paths:
      - "**.excalidraw"
      - "scripts/browser-runtime.mjs"
      - "quartz/plugins/excalidraw*"
      - "quartz/components/scripts/*excalidraw*"
  pull_request:
    paths:
      - "**.excalidraw"
      - "scripts/browser-runtime.mjs"
      - "quartz/plugins/excalidraw*"
      - "quartz/components/scripts/*excalidraw*"
  workflow_dispatch:

jobs:
  test-browser-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Chromium
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci

      - name: Set environment for Puppeteer
        run: |
          echo "PUPPETEER_SKIP_DOWNLOAD=true" >> $GITHUB_ENV
          echo "PUPPETEER_EXECUTABLE_PATH=$(which chromium-browser || which chromium)" >> $GITHUB_ENV

      - name: Test browser runtime
        run: node scripts/browser-runtime.mjs
